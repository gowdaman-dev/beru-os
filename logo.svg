    <path d="M 40 20 L 160 20 C 220 20 250 50 250 95 C 250 125 230 145 195 155 C 240 165 265 190 265 235 C 265 285 225 310 160 310 L 40 310 Z M 95 65 L 95 135 L 155 135 C 185 135 200 120 200 100 C 200 80 185 65 155 65 Z M 95 180 L 95 265 L 165 265 C 195 265 210 250 210 222 C 210 195 195 180 165 180 Z" fill="url(#beruGrad)"/>
