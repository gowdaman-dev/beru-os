  </g>
  <!-- BERU OS Wordmark -->
  <text x="340" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="12">BERU</text>
